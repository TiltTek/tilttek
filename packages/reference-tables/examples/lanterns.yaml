      - {range: 96-00, encounter: {en: The lantern ghost, fr: Le fantôme à la lanterne}}

  - key: armor
    names: {en: Armor, fr: Armures}
    category: equipment
    page: p. 20
    lookup: key
    columns:
      - {key: name, names: {en: Armor, fr: Armure}}
      - {key: defence, names: {en: Defence, fr: Défense}, kind: number}
