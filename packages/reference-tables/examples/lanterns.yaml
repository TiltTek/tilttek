    page: p. 12
    die: 2d6
    columns:
      - {key: attitude, names: {en: Attitude, fr: Attitude}}
      - {key: offer, names: {en: Offer, fr: Offre}}
    rows:
      - {range: "≤2", attitude: {en: Hostile, fr: Hostile}, offer: {en: Attacks or flees, fr: Attaque ou fuit}}
      - {range: 3-5, attitude: {en: Wary, fr: Méfiant}, offer: {en: Wants proof, fr: Veut une preuve}}
      - {range: 6-8, attitude: {en: Uncertain, fr: Incertain}, offer: {en: Listens, fr: Écoute}}
      - {range: 9-11, attitude: {en: Friendly, fr: Amical}, offer: {en: Shares news, fr: Partage les nouvelles}}
      - {range: 12+, attitude: {en: Helpful, fr: Serviable}, offer: {en: Offers a hand, fr: Offre son aide}}

  - key: wandering
    names: {en: Wandering in the old mine, fr: Rencontres dans la vieille mine}
