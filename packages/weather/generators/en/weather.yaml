  weather:
    state:
      zone: temperate
      season: "{{ pick('weather.season.' ~ state.zone) }}"
      condition: { start: "{{ pick('weather.start.' ~ state.zone ~ '.' ~ state.season) }}", next: "{{ pick('weather.transition.' ~ state.zone ~ '.' ~ state.season, where: {from: state.condition}) }}" }
      temperature: { start: "{% set c = pick('weather.climate.' ~ state.zone ~ '.' ~ state.season) %}{% set target = c.middle + pick('weather.condition', where: {id: state.condition}).shift %}{{ target > c.high ? c.high : (target < c.low ? c.low : target) }}", next: "{% set c = pick('weather.climate.' ~ state.zone ~ '.' ~ state.season) %}{% set target = c.middle + pick('weather.condition', where: {id: state.condition}).shift %}{% set before = state.temperature %}{% if before > c.high %}{% set t = before - 2 < c.high ? c.high : before - 2 %}{% elseif before < c.low %}{% set t = before + 2 > c.low ? c.low : before + 2 %}{% else %}{% set t = before + roll(c.change) + (target > before ? 1 : (target < before ? -1 : 0)) %}{% set t = t > c.high ? c.high : (t < c.low ? c.low : t) %}{% endif %}{{ t }}" }
