    help: Imprimez ces cartes pour une table jouée en personne ; chaque participant remplit ses feuilles à la main, et personne d'autre n'a besoin de les voir.
    pdf: Les télécharger en PDF.
    none: Cette table n'utilise aucun outil qui a une carte à imprimer.
