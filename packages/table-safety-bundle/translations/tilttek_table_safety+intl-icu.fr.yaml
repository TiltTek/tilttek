        frequency: À quelle fréquence aimeriez-vous jouer ?
        schedule: Quand êtes-vous disponible ?
        table-rules: Quelles règles de table comptent pour vous (téléphones, nourriture, pauses) ?
        comfort: Qu'est-ce qui vous aiderait à jouer à l'aise ?
        experience: Avez-vous souvent joué à des jeux comme celui-ci ?
        camera: Comment aimeriez-vous participer en ligne ?
        recording: Les séances peuvent-elles être enregistrées ?
