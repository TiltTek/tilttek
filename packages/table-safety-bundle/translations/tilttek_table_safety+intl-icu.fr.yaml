session_zero:
    title: Séance zéro
    help: Les réponses de la table forment son pacte. Le meneur les voit rassemblées, jamais qui a donné laquelle.
    safety_help: 'Gardez ce qui doit rester hors de la partie pour vos lignes et voiles et votre liste de consentement : le meneur les voit dès votre première réponse, jamais qui les a données, alors que les réponses d''ici attendent un groupe de participants.'
    safety_link: Répondre aux lignes, voiles et à la liste
    questions:
        tone: Quel ton voulez-vous pour la partie ?
        pillars: Qu'aimez-vous le plus à la table ?
        themes-welcome: Quels thèmes aimeriez-vous rencontrer ?
